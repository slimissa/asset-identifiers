[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-identifiers-registry"
version = "0.1.0"
description = "Canonical, versioned, machine-readable registry of financial instrument identifiers — ISIN, CUSIP, SEDOL, FIGI, LEI, and ticker symbols."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Le P'tit", email = "slimissa@github.com"}
]
maintainers = [
    {name = "Le P'tit"}
]
requires-python = ">=3.8"
keywords = [
    "finance",
    "trading",
    "securities",
    "isin",
    "cusip",
    "sedol",
    "figi",
    "lei",
    "identifiers",
    "registry",
    "quant",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/slimissa/asset-identifiers"
Documentation = "https://github.com/slimissa/asset-identifiers#readme"
Repository = "https://github.com/slimissa/asset-identifiers.git"
Issues = "https://github.com/slimissa/asset-identifiers/issues"
Changelog = "https://github.com/slimissa/asset-identifiers/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "requests>=2.28",
    "jsonschema>=4.0",
]

[tool.setuptools]
packages = ["asset_identifiers"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
asset_identifiers = ["py.typed"]

[tool.setuptools.data-files]
"share/asset-identifiers" = ["../../identifiers.json", "../../schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["asset_identifiers"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.8"
strict = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]  # Line length handled by formatter

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100