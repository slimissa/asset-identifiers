name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # Weekly on Monday at 02:00 UTC
  workflow_dispatch: {}  # Manual trigger

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Python Validation ────────────────────────────────────────────

  validate-python:
    name: Python — validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest jsonschema requests

      - name: Validate registry
        run: python3 tools/validate.py --verbose --data tests/fixtures/identifiers.test.json

      - name: Build distribution
        run: python3 tools/build.py --data tests/fixtures/identifiers.test.json

      - name: Run Python tests
        run: |
          pytest tests/test_check_digits.py -v
          pytest tests/test_registry.py -v
          pytest tests/test_cross_reference.py -v
          pytest tests/test_wrappers.py -v

  # ─── JavaScript Validation ────────────────────────────────────────

  validate-javascript:
    name: JavaScript — test wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: wrappers/javascript
        run: npm install

      - name: Run JavaScript tests
        working-directory: wrappers/javascript
        run: npm test

  # ─── Rust Validation ──────────────────────────────────────────────

  validate-rust:
    name: Rust — build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wrappers/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wrappers/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: wrappers/rust
        run: cargo fmt --check

      - name: Run clippy
        working-directory: wrappers/rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: wrappers/rust
        run: cargo test

  # ─── Go Validation ────────────────────────────────────────────────

  validate-go:
    name: Go — test wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run Go tests
        working-directory: wrappers/go
        run: go test ./... -v -cover

  # ─── Schema Validation ────────────────────────────────────────────

  validate-schema:
    name: Schema — JSON validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate JSON schema
        run: |
          python3 - << 'EOF'
          import json
          import jsonschema
          from pathlib import Path

          # Load files
          with open("tests/fixtures/identifiers.test.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          with open("schema.json", "r", encoding="utf-8") as f:
              schema = json.load(f)

          # Validate
          validator = jsonschema.Draft7Validator(schema)
          errors = list(validator.iter_errors(data))

          if errors:
              for error in errors[:20]:
                  print(f"  - {error.message} at {'/'.join(str(p) for p in error.path)}")
              exit(1)

          print(f"OK: {data['meta']['count']} instruments validated against schema")
          EOF

      - name: Validate JSON syntax (all files)
        run: |
          python3 - << 'EOF'
          import json
          from pathlib import Path

          json_files = [
              "tests/fixtures/identifiers.test.json",
              "schema.json",
              "history/ticker_changes.json",
              "tests/cross_language_consistency.json",
              "identifiers.dist.json",
              "identifiers.dist.min.json",
          ]

          for file_path in json_files:
              path = Path(file_path)
              if path.exists():
                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          json.load(f)
                      print(f"OK: {file_path}")
                  except json.JSONDecodeError as e:
                      print(f"FAIL: {file_path}: {e}")
                      exit(1)

          print("All JSON files are valid")
          EOF

  # ─── Cross-Language Consistency ───────────────────────────────────

  validate-consistency:
    name: Cross-language consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-python, validate-javascript, validate-rust, validate-go]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Verify cross-language consistency
        run: |
          FIXTURE="tests/fixtures/identifiers.test.json"

          # Each wrapper prints one "ISIN<TAB>ticker<TAB>name" line per
          # fixture instrument, in fixture order. Compare every wrapper's
          # output to the fixture's own values directly — there is no
          # separate "golden" contract file to keep in sync by hand.
          python3 examples/consistency_check.py "$FIXTURE" > /tmp/py.tsv
          node examples/consistency_check.js "$FIXTURE" > /tmp/js.tsv
          (cd wrappers/rust && cargo run --quiet --example consistency_check -- "../../$FIXTURE") > /tmp/rust.tsv
          (cd examples && go run consistency_check.go "../$FIXTURE") > /tmp/go.tsv

          python3 - << 'EOF'
          import json
          from pathlib import Path

          with open("tests/fixtures/identifiers.test.json", "r", encoding="utf-8") as f:
              fixture = json.load(f)

          expected = {
              inst["isin"]: (inst["ticker"], inst["name"])
              for inst in fixture["instruments"]
          }

          def load_tsv(path):
              rows = {}
              for line in Path(path).read_text().splitlines():
                  isin, ticker, name = line.split("\t")
                  rows[isin] = (ticker, name)
              return rows

          wrappers = {
              "Python": load_tsv("/tmp/py.tsv"),
              "JavaScript": load_tsv("/tmp/js.tsv"),
              "Rust": load_tsv("/tmp/rust.tsv"),
              "Go": load_tsv("/tmp/go.tsv"),
          }

          failures = []
          for name, rows in wrappers.items():
              if set(rows) != set(expected):
                  failures.append(f"{name}: returned ISINs {sorted(rows)} != fixture ISINs {sorted(expected)}")
                  continue
              for isin, (exp_ticker, exp_name) in expected.items():
                  got_ticker, got_name = rows[isin]
                  if (got_ticker, got_name) != (exp_ticker, exp_name):
                      failures.append(
                          f"{name}: {isin} — expected ({exp_ticker!r}, {exp_name!r}), "
                          f"got ({got_ticker!r}, {got_name!r})"
                      )

          if failures:
              print(f"FAILED: {len(failures)} disagreement(s) found:")
              for f in failures:
                  print(f"  - {f}")
              exit(1)

          print(f"Cross-language consistency verified: all 4 wrappers agree on {len(expected)} instruments")
          EOF